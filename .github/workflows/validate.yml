name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run consistency tests
        run: python3 -m unittest scripts/test_check_consistency.py -v
      - name: Check current inventory and links
        run: python3 scripts/check_consistency.py
      - name: Validate Skill packages
        run: python3 scripts/validate_repo.py
